[env:rak11310]
custom_meshtastic_hw_model = 26
custom_meshtastic_hw_model_slug = RAK11310
custom_meshtastic_architecture = rp2040
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 2
custom_meshtastic_display_name = RAK WisBlock 11310
custom_meshtastic_images = rak11310.svg
custom_meshtastic_tags = RAK
custom_meshtastic_requires_dfu = true

extends = rp2040_base
board_level = release
board = rakwireless_rak11300
upload_protocol = picotool
# add our variants files to the include and src paths
build_flags = 
  ${rp2040_base.build_flags} 
  -D RAK11310
  -D RS485_SERIAL_PORT=Serial2
  -D RS485_DEFAULT_TX_PIN=0
  -D CUSTOM_RS485_DEFAULT_DE_PIN=6
  -D CUSTOM_RS485_DEFAULT_RE_PIN=1
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
  -D MESHTASTIC_EXCLUDE_WIFI=1
  -D MESHTASTIC_EXCLUDE_MQTT=1
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D MESHTASTIC_EXCLUDE_WAYPOINT=1
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_DROPZONE=1
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  -D MESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -D MESHTASTIC_EXCLUDE_REPLYBOT=1
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_TEXTMESSAGE=1
  -D MESHTASTIC_EXCLUDE_TRAFFIC_MANAGEMENT=1
  -D MESHTASTIC_EXCLUDE_TRACEROUTE=1
  -D MESHTASTIC_EXCLUDE_POWERSTRESS=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -I variants/rp2040/rak11310
  -D DEBUG_RP2040_PORT=Serial
  -D RV3028_RTC=0x52
build_src_filter = ${rp2040_base.build_src_filter} +<../variants/rp2040/rak11310>
# Trim the library set for this minimal logger build: no weather-station / rain / environmental
# sensor stack is needed for the current deployment, so avoid the shared environmental_base bundle.
lib_deps =
  ${arduino_base.lib_deps}
  ${radiolib_base.lib_deps}
  arduino-libraries/ArduinoRS485@1.1.1
  # renovate: datasource=github-tags depName=meshtastic/Crypto packageName=meshtastic/Crypto
  https://github.com/meshtastic/Crypto/archive/591ff9a690e8168ccb7a36abde8d7783e448d395.zip
  # renovate: datasource=custom.pio depName=Melopero RV3028 packageName=melopero/library/Melopero RV3028
  melopero/Melopero RV3028@1.2.0
debug_build_flags = ${rp2040_base.build_flags}, -g
debug_tool = cmsis-dap ; for e.g. Picotool
